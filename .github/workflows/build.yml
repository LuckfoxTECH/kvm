name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kvm_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build device binary
        # CGO stays off so the linux/armv7 binary does not link glibc.
        # The PicoKVM image is uClibc and has no C toolchain in this build.
        env:
          CGO_ENABLED: "0"
        run: make build_release

      - uses: actions/upload-artifact@v4
        with:
          name: kvm_app
          path: bin/kvm_app
          if-no-files-found: error
